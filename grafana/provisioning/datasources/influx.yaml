apiVersion: 1
datasources:
  - name: RLT InfluxDB
    uid: rlt-influx
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: rlt
      defaultBucket: rlt
    secureJsonData:
      token: $INFLUX_TOKEN
